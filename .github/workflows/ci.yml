name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Test with race detector
        run: go test -race ./...
      - name: Test desktop helpers
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Vet
        run: go vet ./...
      - name: Check scripts
        run: |
          bash -n scripts/*.sh
          python3 -m compileall -q scripts
      - name: Scan Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install landing page dependencies
        working-directory: site
        run: npm ci --ignore-scripts
      - name: Lint landing page
        working-directory: site
        run: npm run lint
      - name: Check landing page types
        working-directory: site
        run: npm run typecheck
      - name: Build landing page
        working-directory: site
        env:
          NEXT_PUBLIC_BASE_PATH: /vox
        run: npm run build
      - name: Audit landing page dependencies
        working-directory: site
        run: npm audit --audit-level=high
